          (156543.03392 * Math.cos((ctr.lat * Math.PI) / 180)) /
          Math.pow(2, zt) /
          sc; // meter per px kanvas
        const rawM = mpp * 35 * ppm * u,
          pw = Math.pow(10, Math.floor(Math.log10(rawM)));
        const niceM = rawM / pw >= 5 ? 5 * pw : rawM / pw >= 2 ? 2 * pw : pw;
        const barW = niceM / mpp,
          bX = sX + sW + gap,
          bY = my + mh - gap - fsB * 1.2,
          bH = fsB * 0.55;
        const fmtM = (v) => (v >= 1000 ? v / 1000 + " km" : v + " m");
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        mpRoundRect(
          ctx,
          bX - fsB * 0.6,
          bY - fsB * 3.3,
          barW + fsB * 5.2,
          fsB * 4.9,
          fsB * 0.5
        );
        ctx.fill();
        for (let i = 0; i < 2; i++) {
          ctx.fillStyle = i ? "#fff" : "#111";
          ctx.fillRect(bX + (i * barW) / 2, bY - bH, barW / 2, bH);
        }
        ctx.strokeStyle = "#111";
        ctx.lineWidth = PX;
        ctx.strokeRect(bX, bY - bH, barW, bH);
        ctx.fillStyle = "#111";
        ctx.font = `400 ${fsB * 0.9}px ${MP_FONT}`;
        ctx.textAlign = "center";
        ctx.fillText("0", bX, bY + fsB * 1.1);
        ctx.fillText(fmtM(niceM / 2), bX + barW / 2, bY + fsB * 1.1);
        ctx.fillText(fmtM(niceM), bX + barW, bY + fsB * 1.1);
        ctx.textAlign = "left";
        ctx.font = `600 ${fsB * 0.9}px ${MP_FONT}`;
        ctx.fillText(
          "Skala \u00B1 1 : " +
            Math.round(mpp * ppm * 1000).toLocaleString("id-ID"),
          bX,
          bY - bH - fsB * 0.9
        );
        ctx.font = `400 ${fsB * 0.9}px ${MP_FONT}`;
        placed.push({
          x: bX - fsB * 0.6,
          y: bY - fsB * 3.3,
          w: barW + fsB * 5.2,
          h: fsB * 4.9,
        });

        // Panah utara (kanan atas)
        const naX = mx + mw - gap - fsB * 2.2,
          naY = my + gap + fsB * 5.5;
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.beginPath();
        ctx.arc(naX, naY - fsB * 1.2, fsB * 3.2, 0, 7);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(naX, naY - fsB * 3.6);
        ctx.lineTo(naX + fsB * 1.1, naY + fsB * 0.7);
        ctx.lineTo(naX, naY - fsB * 0.2);
        ctx.closePath();
        ctx.fillStyle = "#111";
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(naX, naY - fsB * 3.6);
        ctx.lineTo(naX - fsB * 1.1, naY + fsB * 0.7);
        ctx.lineTo(naX, naY - fsB * 0.2);
        ctx.closePath();
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.strokeStyle = "#111";
        ctx.lineWidth = PX;
        ctx.stroke();
        ctx.fillStyle = "#111";
        ctx.font = `800 ${fsB * 1.1}px ${MP_FONT}`;
        ctx.textAlign = "center";
        ctx.fillText("U", naX, naY - fsB * 4.1);
        ctx.textAlign = "left";
        placed.push({
          x: naX - fsB * 3.2,
          y: naY - fsB * 4.4,
          w: fsB * 6.4,
          h: fsB * 6.4,
        });

        // ---------- Popup ----------
        const popFs = (allPopups ? 2.1 : 2.5) * u * ppm,
          popMaxW = (allPopups ? 52 : 72) * u * ppm;
        let skipped = 0;
        function placeAndDraw(model, ax, ay, openStyle) {
          const lay = mpLayoutPopup(ctx, model, popFs, popMaxW);
          const g = popFs * 0.9,
            W = lay.w,
            H = lay.h;
          const cands = [];
          (openStyle ? [1] : [1, 1.8, 2.8, 4.2]).forEach((mu) => {
            const d = g * mu;
            cands.push(
              { k: "above", x: ax - W / 2, y: ay - d - H },
              { k: "below", x: ax - W / 2, y: ay + d },
              { k: "right", x: ax + d, y: ay - H / 2 },
              { k: "left", x: ax - d - W, y: ay - H / 2 },
              { k: "ne", x: ax + d, y: ay - d - H },
              { k: "nw", x: ax - d - W, y: ay - d - H },
              { k: "se", x: ax + d, y: ay + d },
              { k: "sw", x: ax - d - W, y: ay + d }
            );
          });
          let best = null;
          cands.forEach((c, idx) => {
            const x = Math.min(Math.max(c.x, mx + 2), mx + mw - W - 2),
              y = Math.min(Math.max(c.y, my + 2), my + mh - H - 2);
            const clamped = Math.abs(x - c.x) > 0.5 || Math.abs(y - c.y) > 0.5;
            let cost = (clamped ? 40 : 0) + idx * 0.5;
            placed.forEach((r) => {
              if (x < r.x + r.w && x + W > r.x && y < r.y + r.h && y + H > r.y)
                cost += 1000;
            });
            if (!openStyle)
              pts.forEach((p) => {
                if (
                  p.x >= x - 4 &&
                  p.x <= x + W + 4 &&
                  p.y >= y - 4 &&
                  p.y <= y + H + 4 &&
                  (Math.abs(p.x - ax) > 1 || Math.abs(p.y - ay) > 1)
                )
                  cost += 3;
              });
            if (!best || cost < best.cost)
              best = { x, y, k: c.k, clamped, cost };
          });
          if (!openStyle && best.cost >= 1000) {
            skipped++;
            return;
          }
          // penghubung ke titik hotspot
          ctx.save();
          if (best.k === "above" && !best.clamped) {
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = PX * 3;
            ctx.beginPath();
            ctx.moveTo(ax - popFs * 0.7, best.y + H - 1);
            ctx.lineTo(ax + popFs * 0.7, best.y + H - 1);
            ctx.lineTo(ax, ay - PX * 1.5);
            ctx.closePath();
            ctx.fillStyle = "#fff";
            ctx.fill();
          } else {
            const nx = Math.min(Math.max(ax, best.x), best.x + W),
              ny = Math.min(Math.max(ay, best.y), best.y + H);
            ctx.strokeStyle = "#222";
            ctx.lineWidth = PX * 1.1;
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(nx, ny);
            ctx.stroke();
          }
          ctx.restore();
          mpDrawPopup(ctx, model, lay, best.x, best.y, PX);
          placed.push({ x: best.x, y: best.y, w: W, h: H });
        }

        let openHs = null;
        if (openPopupRef && openPopupRef.getLatLng) {
          const ll = openPopupRef.getLatLng(),
            model = mpPopupModelFromDom(openPopupRef);
          if (ll && model) {
            const p = proj(ll.lat, ll.lng);
            if (inFrame(p[0], p[1])) {
              placeAndDraw(model, p[0], p[1], true);
              openHs = ll;
            }
          }
        }
        if (allPopups) {
          const cand = pts.filter((pt) => {
            if (!openHs) return true;
            const c = pt.h.geometry.coordinates;
            return !(
              Math.abs(openHs.lat - c[1]) < 1e-7 &&
              Math.abs(openHs.lng - c[0]) < 1e-7
            );
          });
          if (cand.length > MP_MAX_ALL_POPUPS) {
            notes.push(
              `Popup semua hotspot dilewati: ada ${cand.length} hotspot di area peta (maks. ${MP_MAX_ALL_POPUPS}). Persempit filter/zoom peta.`
            );
          } else {
            cand
              .sort((a, b) => a.y - b.y)
              .forEach((pt) =>
                placeAndDraw(mpHotspotModel(pt.h), pt.x, pt.y, false)
              );
            if (skipped)
              notes.push(`${skipped} popup tidak muat di peta dan dilewati.`);
          }
        }
        ctx.restore(); // akhir clip area peta

        // ---------- Bingkai & label koordinat di tepi ----------
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 0.35 * u * ppm;
        ctx.strokeRect(mx, my, mw, mh);
        ctx.strokeStyle = "#666";
        ctx.lineWidth = 0.15 * u * ppm;
        ctx.strokeRect(1, 1, cw - 2, ch - 2);
        if (withGrid) {
          const lfs = 2.2 * u * ppm,
            tick = 1.3 * u * ppm;
          ctx.fillStyle = "#111";
          ctx.strokeStyle = "#000";
          ctx.lineWidth = 0.2 * u * ppm;
          ctx.font = `600 ${lfs}px ${MP_FONT}`;
          ctx.textAlign = "center";
          gridLng.forEach((lng) => {
            const x = proj(0, lng)[0],
              t = mpFmtCoord(lng, step, false);
            ctx.beginPath();
            ctx.moveTo(x, my);
            ctx.lineTo(x, my - tick);
            ctx.moveTo(x, my + mh);
            ctx.lineTo(x, my + mh + tick);
            ctx.stroke();
            ctx.textBaseline = "bottom";
            ctx.fillText(t, x, my - tick - lfs * 0.25);
            ctx.textBaseline = "top";
            ctx.fillText(t, x, my + mh + tick + lfs * 0.25);
          });
          gridLat.forEach((lat) => {
            const y = proj(lat, 0)[1],
              t = mpFmtCoord(lat, step, true);
            ctx.beginPath();
            ctx.moveTo(mx, y);
            ctx.lineTo(mx - tick, y);
            ctx.moveTo(mx + mw, y);
            ctx.lineTo(mx + mw + tick, y);
            ctx.stroke();
            ctx.save();
            ctx.translate(mx - tick - lfs * 0.25, y);
            ctx.rotate(-Math.PI / 2);
            ctx.textBaseline = "bottom";
            ctx.fillText(t, 0, 0);
            ctx.restore();
            ctx.save();
            ctx.translate(mx + mw + tick + lfs * 0.25, y);
            ctx.rotate(Math.PI / 2);
            ctx.textBaseline = "bottom";
            ctx.fillText(t, 0, 0);
            ctx.restore();
          });
          ctx.textAlign = "left";
        }

        // ---------- Susun PDF ----------
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: "landscape",
          unit: "mm",
          format: paper,
        });
        const pageW = doc.internal.pageSize.getWidth(),
          pageH = doc.internal.pageSize.getHeight();
        doc.setProperties({
          title: "Peta Hotspot Hutan Konservasi",
          subject: "Monitoring Hotspot SIPONGI",
        });

        // Logo
        let textX = m;
        const logoH = 14 * u;
        document.querySelectorAll(".map-title-logo").forEach((img) => {
          const lg = mpLogoData(img, 240);
          if (!lg) return;
          const lw = logoH * lg.ratio;
          try {
            doc.addImage(lg.data, "PNG", textX, m, lw, logoH);
            textX += lw + 2 * u;
          } catch (e) {}
        });
        if (textX > m) textX += 2 * u;

        const now = new Date();
        const waktuCetak =
          now.toLocaleDateString("id-ID", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric",
            timeZone: "Asia/Jakarta",
          }) +
          " | " +
          now
            .toLocaleTimeString("id-ID", {
              hour12: false,
              timeZone: "Asia/Jakarta",
            })
            .replace(/\./g, ":") +
          " WIB";
        doc.setTextColor(0, 51, 78);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(15 * u);
        doc.text("HOTSPOT HUTAN KONSERVASI", textX, m + 5.5 * u);
        doc.setTextColor(40);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8 * u);
        const descTxt = areaMode
          ? `Mode: Area terpilih (kotak, \u00B1 ${areaFmtKm2(
              areaKm
            )} km2)  |  Periode: ${currentActiveDateRange}  |  Total: ${
              hsSource.length
            } hotspot`
          : activeFilterDescription();
        const descLines = doc
          .splitTextToSize(descTxt, pageW - textX - m)
          .slice(0, 2);
        doc.text(descLines, textX, m + 10 * u);
        doc.setTextColor(150, 30, 30);
        doc.setFont("helvetica", "bold");
        doc.text(
          "Diproses : " + waktuCetak,
          textX,
          m + 10 * u + descLines.length * 3.6 * u + 0.5 * u
        );

        // Gambar peta
        doc.addImage(
          canvas.toDataURL("image/jpeg", 0.92),
          "JPEG",
          fx,
          fy,
          fw,
          fh,
          undefined,
          "FAST"
        );

        // Footer
        doc.setTextColor(110);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7 * u);
        const fyT = fy + fh + 4 * u;
        doc.text(
          "Monitoring Hotspot SIPONGI - Kawasan Hutan Konservasi",
          fx,
          fyT
        );
        doc.text(
          "Peta dasar: " +
            baseName +
            "  |  Koordinat: derajat desimal WGS 84, proyeksi Web Mercator (EPSG:3857) - GeoPDF",
          pageW / 2,
          fyT,
          { align: "center" }
        );
        doc.text("Halaman 1", pageW - m, fyT, { align: "right" });

        const stamp = toWIBDate(new Date());
        let nm = "hotspot";
        if (areaMode) nm = "area_terpilih";
        else if (activeKawasanIdx !== null)
          nm = kawasanFeatures[activeKawasanIdx].name;
        else if (activeUpt !== null) nm = activeUpt;
        nm =
          nm
            .replace(/[^\w\-]+/g, "_")
            .replace(/^_+|_+$/g, "")
            .substring(0, 50) || "hotspot";
        // ---- Georeferensi: BBox = bingkai peta bagian dalam (di luar pita label koordinat) ----
        const k2pt = 72 / 25.4;
        const sxm = fw / cw, sym = fh / ch; // mm per piksel kanvas
        const bx1 = (fx + mx * sxm) * k2pt,
          bx2 = (fx + (mx + mw) * sxm) * k2pt,
          by_top = (pageH - (fy + my * sym)) * k2pt,
          by_bot = (pageH - (fy + (my + mh) * sym)) * k2pt;
        const fileName = `peta_${nm}_${stamp}.pdf`;
        try {
          const geoBytes = mpGeoreferencePdf(doc.output("arraybuffer"), {
            bbox: [bx1, by_bot, bx2, by_top],
            north: tl[0],
            west: tl[1],
            south: br[0],
            east: br[1],
          });
          const blob = new Blob([geoBytes], { type: "application/pdf" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(a.href);
            a.remove();
          }, 1500);
        } catch (e) {
          console.error("Georeferensi PDF gagal, menyimpan PDF biasa:", e);
          notes.push("Georeferensi gagal, PDF disimpan tanpa referensi spasial.");
          doc.save(fileName);
        }
        return notes.length
          ? "PDF peta tersimpan. Catatan: " + notes.join(" ")
          : "Berhasil mengekspor peta ke PDF";
      }

      function loadWeeklyHotspotDataForCharts() {
        const today = new Date();
        const pastWeek = new Date();
        pastWeek.setDate(today.getDate() - 7);

        const dateTo = toWIBDate(today);
        const dateFrom = toWIBDate(pastWeek);

        const weeklyApiUrl = `https://opsroom.sipongidata.my.id/api/opsroom/indoHotspot?wilayah=IN&filterperiode=true&from=${dateFrom}&to=${dateTo}&late=custom&satelit[]=NASA-MODIS&satelit[]=NASA-SNPP&satelit[]=NASA-NOAA20&confidence[]=low&confidence[]=medium&confidence[]=high&provinsi=&kabkota=`;

        fetch(weeklyApiUrl)
          .then((r) => r.json())
          .then((data) => {
            const features = data.features
              ? data.features.features || data.features
              : [];
            weeklyHotspotRawList = [];

            const kawasanBbox = kawasanGeoJSONData.features.map((f, i) => ({
              feature: f,
              bbox: turf.bbox(f),
              i: i,
            }));

            features.forEach((hotspot) => {
              const conf = (
                hotspot.properties.confidence_level || ""
              ).toLowerCase();
              if (conf !== "high" && conf !== "medium") return;

              const p = hotspot.properties;
              const dateStr = hsDateWIB(p.hs_id);
              if (!dateStr) return;

              if (dateStr >= dateFrom && dateStr <= dateTo) {
                const pt = hotspot.geometry.coordinates;
                for (let k of kawasanBbox) {
                  if (
                    pt[0] >= k.bbox[0] &&
                    pt[0] <= k.bbox[2] &&
                    pt[1] >= k.bbox[1] &&
                    pt[1] <= k.bbox[3]
                  ) {
                    try {
                      if (turf.booleanPointInPolygon(hotspot, k.feature)) {
                        const kItem = kawasanFeatures[k.i];
                        weeklyHotspotRawList.push({
                          nkws: kItem.name,
                          upt: kItem.upt,
                          date: dateStr,
                        });
                        break;
                      }
                    } catch (e) {}
                  }
                }
              }
            });
            renderWeeklyChart();
          })
          .catch((e) => console.error("Gagal memuat data weekly chart:", e));
      }

      let kawasanFailed = false;
      // Muat kawasan: lewat fetch (server/hosting). Jika gagal (mis. dibuka langsung via file://), pakai kawasan.js
      function loadKawasanData() {
        return fetch("kawasan.geojson")
          .then((r) => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .catch(
            () =>
              new Promise((resolve, reject) => {
                const sc = document.createElement("script");
                sc.src = "kawasan.js";
                sc.onload = () =>
                  window.KAWASAN_DATA
                    ? resolve(window.KAWASAN_DATA)
                    : reject(new Error("KAWASAN_DATA kosong"));
                sc.onerror = () =>
                  reject(new Error("kawasan.js tidak ditemukan"));
                document.head.appendChild(sc);
              })
          );
      }
      loadKawasanData()
        .then((data) => {
          kawasanGeoJSONData = data;
          const l = L.geoJSON(data, {
            style: {
              color: "#8c38d1",
              weight: 2,
              opacity: 0.9,
              fillColor: "#8c38d1",
              fillOpacity: 0.05,
            },
            onEachFeature: (f, layer) => {
              if (f.properties)
                kawasanFeatures.push({
                  name: f.properties.NKWS || f.properties.nama || "Kawasan",
                  upt: f.properties.NUPT || f.properties.upt || "-",
                  layer: layer,
                  geoJsonFeature: f,
                  highCount: 0,
                  mediumCount: 0,
                  minDate: null,
                  maxDate: null,
                });
            },
          });
          kawasanLayer.addLayer(l);
          isKawasanLoaded = true;
          populateKawasanDropdown();
          checkAllDataLoaded();

          loadWeeklyHotspotDataForCharts();
          if (hotspotGeoJSONData) processHotspotLayers();

        .catch((e) => {

      /* ===== PENGAMBILAN HOTSPOT PER POTONGAN TANGGAL =====
         Rentang panjang (mis. 1 Juli - Oktober) tidak lagi diminta dalam satu request besar.
         Rentang dipecah per N hari, diambil paralel terbatas, tiap potongan punya timeout +
         coba ulang (backoff); bila tetap gagal potongan dibelah dua sampai 1 hari.
         Semua potongan digabung (tanpa duplikat) menjadi SATU data, sehingga ekspor
         (.pdf/.xlsx/.csv/.shp) tetap menghasilkan satu file utuh. */
      const HS_API_BASE =
        "https://opsroom.sipongidata.my.id/api/opsroom/indoHotspot";
      const HS_CHUNK_DAYS = 7; // ukuran potongan (hari)
      const HS_CONCURRENCY = 3; // jumlah request paralel
      const HS_TIMEOUT_MS = 90000; // batas waktu per request
      const hsSleep = (ms) => new Promise((r) => setTimeout(r, ms));
      let hsLoadToken = 0; // pembatalan otomatis bila ada pemuatan baru

      function hsAddDays(ymd, n) {
        const p = ymd.split("-").map(Number);
        return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n))
          .toISOString()
          .substring(0, 10);
      }
      function hsDiffDays(a, b) {
        const pa = a.split("-").map(Number),
          pb = b.split("-").map(Number);
        return Math.round(
          (Date.UTC(pb[0], pb[1] - 1, pb[2]) -
            Date.UTC(pa[0], pa[1] - 1, pa[2])) /
            86400000
        );
      }
      function hsRangeUrl(from, to) {
        return `${HS_API_BASE}?wilayah=IN&filterperiode=true&from=${from}&to=${to}&late=custom&satelit[]=NASA-MODIS&satelit[]=NASA-SNPP&satelit[]=NASA-NOAA20&confidence[]=low&confidence[]=medium&confidence[]=high&provinsi=&kabkota=`;
      }
      function hsExtract(d) {
        const f = d && d.features ? d.features.features || d.features : [];
        return Array.isArray(f) ? f : [];
      }
      async function hsFetchOnce(url) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), HS_TIMEOUT_MS);
        try {
          const r = await fetch(url, { signal: ctrl.signal });
          if (!r.ok) throw new Error("HTTP " + r.status);
          return hsExtract(await r.json());
        } finally {
          clearTimeout(timer);
        }
      }
      // Satu potongan [a..b]: coba ulang 3x -> belah dua -> sampai 1 hari
      async function hsFetchChunk(a, b, token) {
        let lastErr;
        for (let attempt = 0; attempt < 3; attempt++) {
          if (token !== hsLoadToken) throw new Error("dibatalkan");
          try {
            // mundur 1 hari: hs_id berformat UTC, sedangkan filter memakai tanggal WIB
            return await hsFetchOnce(hsRangeUrl(hsAddDays(a, -1), b));
          } catch (e) {
            lastErr = e;
            await hsSleep(700 * Math.pow(2, attempt));
          }
        }
        const span = hsDiffDays(a, b);
        if (span >= 1) {
          const mid = hsAddDays(a, Math.floor(span / 2));
          const left = await hsFetchChunk(a, mid, token);
          const right = await hsFetchChunk(hsAddDays(mid, 1), b, token);
          return left.concat(right);
        }
        const err = new Error(
          "Gagal mengambil " + a + ": " + (lastErr && lastErr.message)
        );
        err.chunk = { from: a, to: b };
        throw err;
      }
      async function fetchHotspotRange(from, to, token, onProgress) {
        const chunks = [];
        for (let st = from; st <= to; st = hsAddDays(st, HS_CHUNK_DAYS)) {
          const en = hsAddDays(st, HS_CHUNK_DAYS - 1);
          chunks.push({ from: st, to: en > to ? to : en });
        }
        const seen = new Map();
        const failed = [];
        let done = 0,
          next = 0;
        onProgress(0, chunks.length, 0);
        async function worker() {
          while (next < chunks.length) {
            if (token !== hsLoadToken) return;
            const ch = chunks[next++];
            try {
              const feats = await hsFetchChunk(ch.from, ch.to, token);
              feats.forEach((f) => {
                const p = f.properties || {};
                const d = hsDateWIB(p.hs_id);
                if (d === null || d < ch.from || d > ch.to) return; // hanya tanggal WIB potongan ini
                const c = f.geometry && f.geometry.coordinates;
                if (!c) return;
                const key = p.hs_id
                  ? p.hs_id + "|" + c[0] + "|" + c[1]
                  : c[0] + "|" + c[1] + "|" + (p.date_hotspot || "");
                if (!seen.has(key)) seen.set(key, f);
              });
            } catch (e) {
              if (token !== hsLoadToken) return;
              failed.push(e && e.chunk ? e.chunk : ch);
            }
            done++;
            onProgress(done, chunks.length, seen.size);
          }
        }
        const workers = [];
        for (let i = 0; i < Math.min(HS_CONCURRENCY, chunks.length); i++)
          workers.push(worker());
        await Promise.all(workers);
        return { features: [...seen.values()], failed, chunks: chunks.length };
      }

      function loadHotspotData(url, fFrom = null) {
        document.getElementById("cnt-total").innerText = "...";
        const token = ++hsLoadToken;

        // Tanpa filter tanggal: satu request seperti semula
        if (!fFrom) {
          fetch(url)
            .then((r) => r.json())
            .then((d) => {
              if (token !== hsLoadToken) return;
              hotspotGeoJSONData = d;
              processHotspotLayers(null);
            })
            .catch((e) => {
              console.error(e);
              if (token !== hsLoadToken) return;
              hideLoading();
              showToast("Gagal memuat data hotspot. Coba lagi.", true);
            });
          return;
        }

        // Dengan filter tanggal: diambil per potongan lalu digabung
        const toStr = currentActiveDateRange.split(" s/d ")[1];
        fetchHotspotRange(fFrom, toStr, token, (done, total, count) => {
          if (token !== hsLoadToken) return;
          showLoading(
            `Mengambil hotspot ${done}/${total} potongan` +
              (count ? ` (${count.toLocaleString("id-ID")} titik)` : "") +
              "..."
          );
        })
          .then((res) => {
            if (token !== hsLoadToken) return;
            if (res.failed.length === res.chunks) {
              throw new Error("Semua potongan gagal dimuat");
            }
            hotspotGeoJSONData = {
              type: "FeatureCollection",
              features: res.features,
            };
            let msg = null;
            if (res.failed.length) {
              const tgl = res.failed
                .map((c) => (c.from === c.to ? c.from : `${c.from}..${c.to}`))
                .join(", ");
              console.warn("Potongan tanggal gagal dimuat:", tgl);
              msg = `Sebagian data gagal dimuat (${tgl}). Terapkan filter lagi untuk mencoba ulang.`;
            }
            processHotspotLayers(fFrom, msg);
            if (msg) showToast(msg, true);
          })
          .catch((e) => {
            console.error(e);
            if (token !== hsLoadToken) return;
            hideLoading();
            showToast("Gagal memuat data hotspot. Coba lagi.", true);
          });
      }

      initWilayahCombos();
      showLoading("Memuat data kawasan & hotspot...");
      loadHotspotData(DEFAULT_HOTSPOT_URL);

      const legend = L.control({ position: "bottomright" });
      legend.onAdd = () => {
        const div = L.DomUtil.create("div", "legend");
        div.innerHTML = `<h4>Legenda</h4><i style="background: #FF0000; border-radius: 50%;"></i> High Confidence<br><i style="background: #FFFF00; border-radius: 50%;"></i> Medium Confidence<br><i style="border: 2px solid #8c38d1; background: rgba(140,56,209,0.15);"></i> Batas Kawasan`;
        return div;
      };
      legend.addTo(map);

      L.control
        .layers(
          {
            OpenStreetMap: osm,
            "Satelit (Esri)": esriSatelit,
            "Satelit (Google)": googleSatelit,
          },
          {
            "Hotspot Dalam": hotspotDalamLayer,
            "Hotspot Luar": hotspotLuarLayer,
            "Batas Kawasan": kawasanLayer,
            Label: labelKawasanGroup,
          },
          { collapsed: false }
        )
        .addTo(map);
    </script>
  </body>
</html>
