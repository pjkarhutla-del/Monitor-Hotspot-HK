<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Hotspot & Batas Kawasan</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        /* Legenda Peta */
        .legend {
            background: white;
            padding: 10px 15px;
            line-height: 24px;
            color: #333;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
            text-align: center;
        }
        /* Style Ikon Bintang Merah */
        .star-icon {
            color: red;
            font-size: 18px;
            text-shadow: 0 0 3px #000;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inisialisasi Peta (Default Center Indonesia)
        const map = L.map('map').setView([-2.548926, 118.014863], 5);

        // Basemap OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Group Layer untuk Kontrol Overlay
        const hotspotLayer = L.layerGroup().addTo(map);
        const kawasanLayer = L.layerGroup().addTo(map);

        // 2. Memuat Batas Kawasan (kawasan.geojson dari GitHub)
        fetch('kawasan.geojson')
            .then(response => response.json())
            .then(data => {
                const layer = L.geoJSON(data, {
                    style: {
                        color: "#0000FF", // Outline biru
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0.1,
                        fillColor: "#0000FF"
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties) {
                            let popupText = "<b>Batas Kawasan</b><br>";
                            for (let key in feature.properties) {
                                popupText += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                            }
                            layer.bindPopup(popupText);
                        }
                    }
                });
                kawasanLayer.addLayer(layer);
            })
            .catch(err => console.error("Gagal memuat kawasan.geojson:", err));

        // 3. Memuat Data Hotspot dari API Sipongi
        const apiUrl = 'https://opsroom.sipongidata.my.id/api/opsroom/indoHotspot?wilayah=IN&filterperiode=false&from=&to=&late=24&satelit[]=NASA-MODIS&satelit[]=NASA-SNPP&satelit[]=NASA-NOAA20&confidence[]=low&confidence[]=medium&confidence[]=high&provinsi=&kabkota=';

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    // Filter tingkat kepercayaan medium & high
                    filter: function(feature) {
                        const conf = feature.properties.confidence_level ? feature.properties.confidence_level.toLowerCase() : '';
                        return conf === 'medium' || conf === 'high';
                    },
                    // Simbolisasi Titik (Marker)
                    pointToLayer: function (feature, latlng) {
                        const conf = feature.properties.confidence_level ? feature.properties.confidence_level.toLowerCase() : '';

                        if (conf === 'high') {
                            // Simbol Bintang Merah
                            const starIcon = L.divIcon({
                                html: '<i class="fa-solid fa-star star-icon"></i>',
                                className: '',
                                iconSize: [20, 20],
                                iconAnchor: [10, 10]
                            });
                            return L.marker(latlng, { icon: starIcon });
                        } else if (conf === 'medium') {
                            // Simbol Lingkaran Kuning
                            return L.circleMarker(latlng, {
                                radius: 6,
                                fillColor: "#FFFF00", // Kuning
                                color: "#000",
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.9
                            });
                        }
                    },
                    // Popup Informasi Detail Hotspot
                    onEachFeature: function (feature, layer) {
                        const p = feature.properties;
                        const popupContent = `
                            <div style="font-size: 13px;">
                                <h4 style="margin: 0 0 5px 0; color: #d9534f;">Hotspot ${p.sumber || ''}</h4>
                                <b>Waktu:</b> ${p.date_hotspot || '-'}<br>
                                <b>Confidence Level:</b> <span style="font-weight:bold; color:${p.confidence_level === 'high' ? 'red' : 'orange'};">${p.confidence_level} (${p.confidence})</span><br>
                                <b>Lokasi:</b> Desa ${p.desa || '-'}, Kec. ${p.kecamatan || '-'}, ${p.kabkota || '-'}, ${p.nama_provinsi || '-'}<br>
                                <b>Koordinat:</b> ${p.lat}, ${p.long}<br>
                                ${p.route_create ? `<a href="${p.route_create}" target="_blank" style="display:inline-block; margin-top:8px; background:#0275d8; color:white; padding:3px 8px; text-decoration:none; border-radius:3px;">Form Groundcheck</a>` : ''}
                            </div>
                        `;
                        layer.bindPopup(popupContent);
                    }
                }).addTo(hotspotLayer);
            })
            .catch(err => console.error("Gagal memuat API Hotspot:", err));

        // 4. Menambahkan Legenda
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>Legenda</h4>
                <i class="fa-solid fa-star" style="color:red; font-size:14px;"></i> Hotspot High Confidence<br>
                <i style="background: #FFFF00; border-radius: 50%; border: 1px solid #000;"></i> Hotspot Medium Confidence<br>
                <i style="border: 2px solid #0000FF; background: rgba(0,0,255,0.1);"></i> Batas Kawasan
            `;
            return div;
        };
        legend.addTo(map);

        // 5. Kontrol Layer Peta
        const overlayMaps = {
            "Titik Hotspot": hotspotLayer,
            "Batas Kawasan": kawasanLayer
        };
        L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

    </script>
</body>
</html>
