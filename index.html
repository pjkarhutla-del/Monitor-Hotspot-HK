<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Hotspot & Batas Kawasan</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome untuk ikon bintang -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        /* Legenda Peta */
        .legend {
            background: white;
            padding: 10px 15px;
            line-height: 24px;
            color: #333;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .legend h4 {
            margin: 0 0 5px 0;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
            text-align: center;
        }
        /* Style Ikon Bintang Merah */
        .star-icon {
            color: red;
            font-size: 18px;
            text-shadow: 0 0 3px #000;
        }

        /* -----------------------------------------------------------
           STYLE LABEL DINAMIS (NKWS)
        ----------------------------------------------------------- */
        .kawasan-label-dynamic {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: #000080;
            font-weight: bold;
            text-align: center;
            white-space: normal !important; /* Enable wrap text */
            word-wrap: break-word;
            max-width: 150px; /* Batas lebar wrap text */
            line-height: 1.2;
            pointer-events: none; /* Klik tembus ke layer bawahnya */
            
            /* Buffer / Text Halo Warna Putih */
            text-shadow: 
                -1px -1px 2px #fff,  
                 1px -1px 2px #fff,
                -1px  1px 2px #fff,
                 1px  1px 2px #fff,
                 0px  0px 4px #fff;
        }
        
        /* Hapus panah bawaan tooltip Leaflet */
        .kawasan-label-dynamic::before {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inisialisasi Basemap
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        });

        const esriSatelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        const googleSatelit = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '&copy; Google Maps'
        });

        const map = L.map('map', {
            center: [-2.548926, 118.014863],
            zoom: 5,
            layers: [osm]
        });

        // Layer Group
        const hotspotLayer = L.layerGroup().addTo(map);
        const kawasanLayer = L.layerGroup().addTo(map);

        // Ambang batas Zoom Minimum untuk Menampilkan Label Nama Kawasan
        const MIN_ZOOM_LABEL = 10; 

        // Array penampung referensi tooltip kawasan untuk penyesuaian font dinamis
        let kawasanTooltips = [];

        // 2. Memuat Batas Kawasan (kawasan.geojson)
        fetch('kawasan.geojson')
            .then(response => response.json())
            .then(data => {
                const layer = L.geoJSON(data, {
                    style: {
                        color: "#0000FF", // Outline biru
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0.15,
                        fillColor: "#0000FF"
                    },
                    onEachFeature: function (feature, layer) {
                        // Popup Detail Kawasan
                        if (feature.properties) {
                            let popupText = "<b>Batas Kawasan</b><br>";
                            for (let key in feature.properties) {
                                popupText += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                            }
                            layer.bindPopup(popupText);

                            // Label Dinamis NKWS
                            if (feature.properties.NKWS) {
                                layer.bindTooltip(feature.properties.NKWS, {
                                    permanent: true,
                                    direction: 'center',
                                    className: 'kawasan-label-dynamic'
                                });

                                // Simpan referensi layer untuk manipulasi ukuran font & visibilitas
                                layer.on('add', function() {
                                    const tooltip = layer.getTooltip();
                                    if (tooltip) {
                                        kawasanTooltips.push(tooltip);
                                        updateLabelStyle();
                                    }
                                });
                            }
                        }
                    }
                });
                kawasanLayer.addLayer(layer);
            })
            .catch(err => console.error("Gagal memuat kawasan.geojson:", err));

        // Function untuk Mengatur Ukuran Font dan Visibilitas Label Berdasarkan Zoom Level
        function updateLabelStyle() {
            const currentZoom = map.getZoom();

            kawasanTooltips.forEach(tooltip => {
                const element = tooltip.getElement();
                if (element) {
                    if (currentZoom < MIN_ZOOM_LABEL) {
                        // Sembunyikan label jika belum mencapai zoom minimal
                        element.style.display = 'none';
                    } else {
                        // Tampilkan label dan hitung ukuran font dinamis
                        element.style.display = 'block';
                        
                        // Formula kalkulasi ukuran font berdasarkan level zoom (Contoh: Zoom 10 = 11px, Zoom 15 = 18px)
                        const fontSize = Math.max(10, 11 + (currentZoom - MIN_ZOOM_LABEL) * 1.5);
                        element.style.fontSize = fontSize + 'px';
                    }
                }
            });
        }

        // Event Listener saat peta di-zoom
        map.on('zoomend', updateLabelStyle);

        // 3. Memuat Data Hotspot dari API Sipongi
        const apiUrl = 'https://opsroom.sipongidata.my.id/api/opsroom/indoHotspot?wilayah=IN&filterperiode=false&from=&to=&late=24&satelit[]=NASA-MODIS&satelit[]=NASA-SNPP&satelit[]=NASA-NOAA20&confidence[]=low&confidence[]=medium&confidence[]=high&provinsi=&kabkota=';

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    filter: function(feature) {
                        const conf = feature.properties.confidence_level ? feature.properties.confidence_level.toLowerCase() : '';
                        return conf === 'medium' || conf === 'high';
                    },
                    pointToLayer: function (feature, latlng) {
                        const conf = feature.properties.confidence_level ? feature.properties.confidence_level.toLowerCase() : '';

                        if (conf === 'high') {
                            const starIcon = L.divIcon({
                                html: '<i class="fa-solid fa-star star-icon"></i>',
                                className: '',
                                iconSize: [20, 20],
                                iconAnchor: [10, 10]
                            });
                            return L.marker(latlng, { icon: starIcon });
                        } else if (conf === 'medium') {
                            return L.circleMarker(latlng, {
                                radius: 6,
                                fillColor: "#FFFF00",
                                color: "#000",
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.9
                            });
                        }
                    },
                    onEachFeature: function (feature, layer) {
                        const p = feature.properties;
                        const popupContent = `
                            <div style="font-size: 13px;">
                                <h4 style="margin: 0 0 5px 0; color: #d9534f;">Hotspot ${p.sumber || ''}</h4>
                                <b>Waktu:</b> ${p.date_hotspot || '-'}<br>
                                <b>Confidence Level:</b> <span style="font-weight:bold; color:${p.confidence_level === 'high' ? 'red' : 'orange'};">${p.confidence_level} (${p.confidence})</span><br>
                                <b>Lokasi:</b> Desa ${p.desa || '-'}, Kec. ${p.kecamatan || '-'}, ${p.kabkota || '-'}, ${p.nama_provinsi || '-'}<br>
                                <b>Koordinat:</b> ${p.lat}, ${p.long}<br>
                                ${p.route_create ? `<a href="${p.route_create}" target="_blank" style="display:inline-block; margin-top:8px; background:#0275d8; color:white; padding:3px 8px; text-decoration:none; border-radius:3px;">Form Groundcheck</a>` : ''}
                            </div>
                        `;
                        layer.bindPopup(popupContent);
                    }
                }).addTo(hotspotLayer);
            })
            .catch(err => console.error("Gagal memuat API Hotspot:", err));

        // 4. Legenda Peta
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>Legenda</h4>
                <i class="fa-solid fa-star" style="color:red; font-size:14px;"></i> High<br>
                <i style="background: #FFFF00; border-radius: 50%; border: 1px solid #000;"></i> Medium<br>
                <i style="border: 2px solid #0000FF; background: rgba(0,0,255,0.15);"></i> Batas Kawasan
            `;
            return div;
        };
        legend.addTo(map);

        // 5. Kontrol Layer Peta
        const baseMaps = {
            "OpenStreetMap": osm,
            "Satelit (Esri)": esriSatelit,
            "Satelit (Google)": googleSatelit
        };

        const overlayMaps = {
            "Titik Hotspot": hotspotLayer,
            "Batas Kawasan": kawasanLayer
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

    </script>
</body>
</html>
